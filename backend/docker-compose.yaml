services:
  finanzas_directus:
    container_name: finanzas_directus
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-8055}:8055"
    volumes:
      - directus_uploads:/directus/uploads
    depends_on:
      finanzas_db:
        condition: service_healthy
      finanzas_cache:
        condition: service_started
    environment:
      KEY: "${KEY:?KEY must be set}"
      SECRET: "${SECRET:?SECRET must be set}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@finanzas.local}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}"
      DB_CLIENT: "pg"
      DB_HOST: "${DB_HOST:-finanzas_db}"
      DB_PORT: "${DB_PORT:-5432}"
      DB_DATABASE: "${DB_DATABASE:-directus}"
      DB_USER: "${DB_USER:-directus}"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD must be set}"
      CACHE_ENABLED: "${CACHE_ENABLED:-true}"
      CACHE_STORE: "redis"
      CACHE_REDIS: "${REDIS:-redis://finanzas_cache:6379}"
      REDIS: "${REDIS:-redis://finanzas_cache:6379}"
      CACHE_NAMESPACE: "${CACHE_NAMESPACE:-directus-cache}"
      CACHE_TTL: "${CACHE_TTL:-5m}"
      CACHE_AUTO_PURGE: "${CACHE_AUTO_PURGE:-true}"
      CORS_ENABLED: "true"
      CORS_ORIGIN: "${CORS_ORIGIN:-*}"
      PUBLIC_URL: "${PUBLIC_URL:-http://localhost:8055}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8055/server/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: always

  finanzas_db:
    container_name: finanzas_db
    build:
      context: .
      dockerfile: Dockerfile.db
    volumes:
      - finanzas_postgres_data_v2:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: "${DB_USER:-directus}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD must be set}"
      POSTGRES_DB: "${DB_DATABASE:-directus}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-directus} -d ${DB_DATABASE:-directus}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  finanzas_cache:
    container_name: finanzas_cache
    image: redis:6-alpine
    command: redis-server --appendonly yes
    volumes:
      - finanzas_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: always

volumes:
  finanzas_postgres_data_v2:
    name: finanzas_postgres_data_v2
  finanzas_redis_data:
  directus_uploads:
